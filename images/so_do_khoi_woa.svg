<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 1440" width="1010" height="1440" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">

    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0b1120" />
        <stop offset="100%" stop-color="#0f172a" />
      </linearGradient>

      <!-- Markers for arrows -->
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
      </marker>
      <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
      </marker>
      <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
      </marker>
      <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
      </marker>
      <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
      </marker>

      <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
        <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
      </filter>
    </defs>
    
<rect width="1010" height="1440" fill="url(#bgGrad)" />

        <rect x="390.0" y="17.0" width="140" height="36" rx="18.0" fill="#1d4ed8" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
        <text x="460" y="39.5" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">BẮT ĐẦU</text>
        
<line x1="460" y1="53" x2="460" y2="80" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="240" y="80" width="440" height="60" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
<text x="460.0" y="102" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">BƯỚC 1: NẠP DỮ LIỆU ĐỀ BÀI (load_problem)</text>
<text x="460.0" y="122" fill="#cbd5e1" font-size="10.8" text-anchor="middle">Ca A, B, C (pin 220, 8 trại, bão + biên an toàn)</text>
<line x1="460" y1="140" x2="460" y2="165" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="240" y="165" width="440" height="60" rx="8" fill="#1e293b" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
<text x="460.0" y="187" fill="#60a5fa" font-size="12" font-weight="bold" text-anchor="middle">BƯỚC 2: KHỞI TẠO QUẦN THỂ 30 BIẾN</text>
<text x="460.0" y="207" fill="#cbd5e1" font-size="10.8" text-anchor="middle">Mỗi cá thể: 10 điểm × [x, y in 0..100, pin in 0..25]</text>
<line x1="460" y1="225" x2="460" y2="255" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="230" y="255" width="460" height="76" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
<text x="460.0" y="277" fill="#93c5fd" font-size="12" font-weight="bold" text-anchor="middle">KHỞI TẠO: SỬA BIÊN &amp; KHỞI TẠO LEADER</text>
<text x="460.0" y="297" fill="#cbd5e1" font-size="10.8" text-anchor="middle">Kẹp biến về [0..100] và [0..25] qua clip_to_bounds</text>
<text x="460.0" y="315" fill="#cbd5e1" font-size="10.8" text-anchor="middle">Chấm điểm bầy ban đầu, khởi tạo 3 sổ ghi leader</text>
<line x1="460" y1="331" x2="460" y2="390" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<polygon points="460,390.0 535.0,420 460,450.0 385.0,420" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
<text x="460" y="424.5" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">t &lt; T ?</text>
<line x1="535" y1="420" x2="710" y2="420" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
<text x="575" y="408" fill="#f87171" font-size="10.5" font-weight="bold">Hết lượt (t = T)</text>
<rect x="710" y="381" width="220" height="78" rx="8" fill="#1c1917" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
<text x="820.0" y="403" fill="#fca5a5" font-size="12" font-weight="bold" text-anchor="middle">XUẤT KẾT QUẢ TỐI ƯU</text>
<text x="820.0" y="423" fill="#cbd5e1" font-size="10.8" text-anchor="middle">Trả về cá thể tốt nhất X*</text>
<text x="820.0" y="441" fill="#cbd5e1" font-size="10.8" text-anchor="middle">Đường bay 12 điểm &amp; Pin</text>
<line x1="820" y1="459" x2="820" y2="501" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>

        <rect x="757.5" y="501.0" width="125" height="38" rx="19.0" fill="#991b1b" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
        <text x="820" y="524.5" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">KẾT THÚC</text>
        
<line x1="460" y1="450" x2="460" y2="490" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="470" y="473" fill="#34d399" font-size="10.5" font-weight="bold">Còn lượt (t &lt; T)</text>
<rect x="230" y="490" width="460" height="76" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow)"/>
<text x="460.0" y="512" fill="#22d3ee" font-size="12" font-weight="bold" text-anchor="middle">BƯỚC 4: TÍNH HỆ SỐ a(t) VÀ GIỮ RIÊNG a2</text>
<text x="460.0" y="532" fill="#cbd5e1" font-size="10.8" text-anchor="middle">Tính a(t): linear / cosine / quadratic theo t/T</text>
<text x="460.0" y="550" fill="#cbd5e1" font-size="10.8" text-anchor="middle">Giữ riêng luật tác giả: a2 = -1 - t/T (nhánh xoắn ốc)</text>
<line x1="460" y1="566" x2="460" y2="596" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<polygon points="460,596.0 535.0,625 460,654.0 385.0,625" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
<text x="460" y="629.5" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">p &lt; 0.5 ?</text>
<line x1="535" y1="625" x2="770" y2="625" stroke="#c084fc" stroke-width="1.5"/>
<line x1="770" y1="625" x2="770" y2="735" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
<text x="560" y="615" fill="#c084fc" font-size="10.5" font-weight="bold">p &gt;= 0.5</text>
<line x1="385" y1="625" x2="260" y2="625" stroke="#38bdf8" stroke-width="1.5"/>
<line x1="260" y1="625" x2="260" y2="662" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="330" y="615" fill="#38bdf8" font-size="10.5" font-weight="bold">p &lt; 0.5</text>
<polygon points="260,662.0 330.0,690 260,718.0 190.0,690" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
<text x="260" y="694.5" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">|A| &lt; 1 ?</text>
<line x1="260" y1="718" x2="260" y2="755" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="272" y="740" fill="#38bdf8" font-size="10.5" font-weight="bold">|A| &lt; 1</text>
<line x1="190" y1="690" x2="105" y2="690" stroke="#fbbf24" stroke-width="1.5"/>
<line x1="105" y1="690" x2="105" y2="755" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
<text x="135" y="680" fill="#fbbf24" font-size="10.5" font-weight="bold">|A| &gt;= 1</text>
<rect x="10" y="755" width="190" height="95" rx="8" fill="#1c1917" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
<text x="105.0" y="777" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">NHÁNH 2: KHÁM PHÁ</text>
<text x="105.0" y="797" fill="#cbd5e1" font-size="10.8" text-anchor="middle">D = |C·X_rand - X|</text>
<text x="105.0" y="815" fill="#cbd5e1" font-size="10.8" text-anchor="middle">X = X_rand - A·D</text>
<text x="105.0" y="833" fill="#cbd5e1" font-size="10.8" text-anchor="middle">|A| &gt;= 1 (dò tìm)</text>
<rect x="215" y="755" width="210" height="95" rx="8" fill="#082f49" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
<text x="320.0" y="777" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">NHÁNH 1: BAO VÂY</text>
<text x="320.0" y="797" fill="#cbd5e1" font-size="10.8" text-anchor="middle">D = |C·X* - X|</text>
<text x="320.0" y="815" fill="#cbd5e1" font-size="10.8" text-anchor="middle">X = X* - A·D</text>
<text x="320.0" y="833" fill="#cbd5e1" font-size="10.8" text-anchor="middle">|A| &lt; 1 (khai thác)</text>
<rect x="655" y="735" width="230" height="95" rx="8" fill="#2e1065" stroke="#7e22ce" stroke-width="1.5" filter="url(#shadow)"/>
<text x="770.0" y="757" fill="#c084fc" font-size="12" font-weight="bold" text-anchor="middle">NHÁNH 3: XOẮN ỐC</text>
<text x="770.0" y="777" fill="#cbd5e1" font-size="10.8" text-anchor="middle">D' = |X* - X|</text>
<text x="770.0" y="795" fill="#cbd5e1" font-size="10.8" text-anchor="middle">X = X* + D'·eᵇˡ·cos(2πl)</text>
<text x="770.0" y="813" fill="#cbd5e1" font-size="10.8" text-anchor="middle">p &gt;= 0.5 (xoắn quanh X*)</text>
<line x1="105" y1="850" x2="105" y2="875" stroke="#fbbf24" stroke-width="1.5"/>
<line x1="320" y1="850" x2="320" y2="875" stroke="#38bdf8" stroke-width="1.5"/>
<line x1="770" y1="830" x2="770" y2="875" stroke="#c084fc" stroke-width="1.5"/>
<line x1="105" y1="875" x2="770" y2="875" stroke="#64748b" stroke-width="1.5"/>
<line x1="460" y1="875" x2="460" y2="905" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="215" y="905" width="490" height="76" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
<text x="460.0" y="927" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">1. SỬA BIÊN VỊ TRÍ (clip_to_bounds)</text>
<text x="460.0" y="947" fill="#cbd5e1" font-size="10.8" text-anchor="middle">Kéo giá trị vượt ngoài miền về cạnh gần nhất:</text>
<text x="460.0" y="965" fill="#cbd5e1" font-size="10.8" text-anchor="middle">x, y in [0.0, 100.0]  |  pin đề xuất in [0.0, 25.0]</text>
<line x1="460" y1="981" x2="460" y2="1010" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="215" y="1010" width="490" height="96" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
<text x="460.0" y="1032" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle">2. GIẢI MÃ TOP-K ĐÈN (decode_solution)</text>
<text x="460.0" y="1052" fill="#cbd5e1" font-size="10.8" text-anchor="middle">• Giữ nguyên 10 điểm tọa độ trên đường bay</text>
<text x="460.0" y="1070" fill="#cbd5e1" font-size="10.8" text-anchor="middle">• Bật Top-K trạm pin lớn nhất (hòa ưu tiên chỉ số nhỏ)</text>
<text x="460.0" y="1088" fill="#cbd5e1" font-size="10.8" text-anchor="middle">• Trạm ngoài Top-K: tắt đèn (pin thực tế = 0)</text>
<line x1="460" y1="1106" x2="460" y2="1135" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="215" y="1135" width="490" height="96" rx="8" fill="#1e293b" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
<text x="460.0" y="1157" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">3. CHẤM ĐIỂM HÀM MỤC TIÊU &amp; PHẠT (evaluate_solution)</text>
<text x="460.0" y="1177" fill="#cbd5e1" font-size="10.8" text-anchor="middle">• Chiều dài L, phạt bão Pc, pin bay, tín hiệu 8 trại</text>
<text x="460.0" y="1195" fill="#cbd5e1" font-size="10.8" text-anchor="middle">• Mục tiêu chưa phạt: f0 = -U + 0.12·(L/100)</text>
<text x="460.0" y="1213" fill="#cbd5e1" font-size="10.8" text-anchor="middle">• Điểm xếp hạng bầy cá voi: J = f0 + Phạt vi phạm</text>
<line x1="460" y1="1231" x2="460" y2="1260" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="215" y="1260" width="490" height="96" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="460.0" y="1282" fill="#a5b4fc" font-size="12" font-weight="bold" text-anchor="middle">4. CẬP NHẬT 3 SỔ GHI LEADER</text>
<text x="460.0" y="1302" fill="#cbd5e1" font-size="10.8" text-anchor="middle">1. best_overall: Nghiệm có J nhỏ nhất đàn</text>
<text x="460.0" y="1320" fill="#cbd5e1" font-size="10.8" text-anchor="middle">2. best_valid: Nghiệm hợp lệ có f0 tốt nhất</text>
<text x="460.0" y="1338" fill="#cbd5e1" font-size="10.8" text-anchor="middle">3. best_gate: Nghiệm hợp lệ qua khe Ca B</text>
<line x1="460" y1="1356" x2="460" y2="1390" stroke="#64748b" stroke-width="1.5"/>
<line x1="460" y1="1390" x2="960" y2="1390" stroke="#64748b" stroke-width="1.5"/>
<line x1="960" y1="1390" x2="960" y2="350" stroke="#64748b" stroke-width="1.5"/>
<line x1="960" y1="350" x2="460" y2="350" stroke="#64748b" stroke-width="1.5"/>
<line x1="460" y1="350" x2="460" y2="390" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="710" y="1380" fill="#94a3b8" font-size="10.5">Tăng lượt: t = t + 1 &amp; Lặp lại</text>
</svg>